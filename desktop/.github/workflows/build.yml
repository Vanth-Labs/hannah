name: build

# Buildea Hannah (Electron) para Linux, Windows y Mac en runners nativos.
# Dispara al pushear un tag v* (p.ej. v1.0.1) o a mano (workflow_dispatch).
# NOTA: este repo (hannah-desktop) empaqueta el frontend (repo aparte). El job clona
# Vanth-Labs/frontend como hermano, lo buildea, y luego arma el instalador.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to (e.g. v1.0.3); empty = build only"
        required: false
        default: ""

# Mínimo por defecto; solo el job `release` sube a `contents: write`. Las actions van fijadas
# por SHA (el tag `v4` es móvil: quien controle la action controlaría este build).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
          - os: windows-latest
            args: --win nsis
          - os: macos-latest
            args: --mac dmg --arm64 --x64   # Apple Silicon e Intel, firma ad-hoc con entitlements (ver package.json build.mac)
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout hannah-desktop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: hannah-desktop
          persist-credentials: false

      # El frontend es un repo PÚBLICO hermano: el GITHUB_TOKEN del job basta para leerlo.
      - name: Checkout frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Vanth-Labs/frontend
          path: hannah-frontend
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Build frontend (dist que empaqueta Electron)
        working-directory: hannah-frontend
        # --legacy-peer-deps es OBLIGATORIO en el frontend (vite 5 vs @vitejs/plugin-basic-ssl,
        # que pide vite >=6): con `npm ci` a secas el job falla antes de buildear nada.
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Build desktop installer
        working-directory: hannah-desktop
        env:
          # Sin certificado (personal): en Linux/Windows evita que electron-builder busque uno.
          # En macOS NO se pone: anula la identidad ad-hoc ("-") de build.mac, y sin firma ni
          # entitlements macOS nunca pide el micro (TCC deniega en silencio).
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os != 'macos-latest' }}
        run: |
          npm ci
          # --publish never: en CI electron-builder intenta subir él mismo al release y exige
          # GH_TOKEN; publicar es trabajo del job `release`, con los tres SO juntos.
          npx electron-builder ${{ matrix.args }} --publish never

      # Que no vuelva a salir un DMG sin firma: la app tiene que estar firmada (ad-hoc) y llevar
      # el entitlement del micro, si no macOS no muestra el prompt y Hannah queda sorda sin error.
      - name: Verificar firma y entitlements (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: hannah-desktop
        run: |
          set -e
          found=0
          for app in dist/mac*/Hannah.app; do
            [ -d "$app" ] || continue
            found=1
            codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc' || { echo "FAIL: $app no esta firmada"; exit 1; }
            codesign -d --entitlements - "$app" 2>/dev/null | grep -q 'com.apple.security.device.audio-input' || { echo "FAIL: $app sin entitlement audio-input"; exit 1; }
            echo "ok: $app firmada ad-hoc con entitlements"
          done
          [ "$found" = 1 ] || { echo "FAIL: no hay Hannah.app en dist/mac*"; exit 1; }

      - name: Subir artefactos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hannah-${{ matrix.os }}
          path: |
            hannah-desktop/dist/*.AppImage
            hannah-desktop/dist/*.deb
            hannah-desktop/dist/*.exe
            hannah-desktop/dist/*.dmg
          if-no-files-found: ignore

  # Con un tag v*, los instaladores de los tres SO se PUBLICAN como release de GitHub. Es lo
  # que consume el install.sh del sitio (releases/latest): sin este job, subir artefactos al
  # workflow no los hace descargables y el instalador sigue dando 404.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      # Sumas que verifican los instaladores antes de instalar la app. (Los pesos del modelo de
      # gestos viven en su propio release, Vanth-Labs/motion-model `models`, con sus sumas.)
      - name: SHA256SUMS
        run: cd artifacts && sha256sum *.AppImage *.deb *.exe *.dmg 2>/dev/null > SHA256SUMS; cat SHA256SUMS
      - name: Publicar release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/SHA256SUMS
          generate_release_notes: true
