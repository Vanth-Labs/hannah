name: build

# Buildea Hannah (Electron) para Linux, Windows y Mac en runners nativos.
# Dispara al pushear un tag v* (p.ej. v1.0.1) o a mano (workflow_dispatch).
# NOTA: este repo (hannah-desktop) empaqueta el frontend (repo aparte). El job clona
# Hannah-Motion-Lab/frontend como hermano, lo buildea, y luego arma el instalador.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Mínimo por defecto; solo el job `release` sube a `contents: write`. Las actions van fijadas
# por SHA (el tag `v4` es móvil: quien controle la action controlaría este build).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
          - os: windows-latest
            args: --win nsis
          - os: macos-latest
            args: --mac dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout hannah-desktop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: hannah-desktop
          persist-credentials: false

      # Los repos de la organización son PRIVADOS: el GITHUB_TOKEN del job solo ve ESTE repo.
      # Hace falta un secret HANNAH_REPO_TOKEN (PAT fine-grained con Contents:read sobre
      # Hannah-Motion-Lab/frontend) en Settings > Secrets de este repo.
      - name: Checkout frontend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Hannah-Motion-Lab/frontend
          path: hannah-frontend
          token: ${{ secrets.HANNAH_REPO_TOKEN }}
          persist-credentials: false   # el PAT no debe quedar en .git/config del checkout

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Build frontend (dist que empaqueta Electron)
        working-directory: hannah-frontend
        # --legacy-peer-deps es OBLIGATORIO en el frontend (vite 5 vs @vitejs/plugin-basic-ssl,
        # que pide vite >=6): con `npm ci` a secas el job falla antes de buildear nada.
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Build desktop installer
        working-directory: hannah-desktop
        env:
          # Sin firma de código (personal); evita que electron-builder busque certificados.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm ci
          npx electron-builder ${{ matrix.args }}

      - name: Subir artefactos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hannah-${{ matrix.os }}
          path: |
            hannah-desktop/dist/*.AppImage
            hannah-desktop/dist/*.deb
            hannah-desktop/dist/*.exe
            hannah-desktop/dist/*.dmg
          if-no-files-found: ignore

  # Con un tag v*, los instaladores de los tres SO se PUBLICAN como release de GitHub. Es lo
  # que consume el install.sh del sitio (releases/latest): sin este job, subir artefactos al
  # workflow no los hace descargables y el instalador sigue dando 404.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      # Sumas que verifica install.sh antes de instalar el AppImage (y lo que liste aquí).
      - name: SHA256SUMS
        run: cd artifacts && sha256sum *.AppImage *.deb *.exe *.dmg 2>/dev/null > SHA256SUMS; cat SHA256SUMS
      - name: Publicar release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/SHA256SUMS
          generate_release_notes: true
